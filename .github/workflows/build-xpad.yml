
name: Diagnose Ace 3 Pro Xbox Controller Rumble

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y git curl python3

      - name: Install repo tool
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o repo
          chmod +x repo
          sudo install repo /usr/local/bin/repo
          repo --version

      - name: Initialize official OnePlus source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/kernel-work"
          cd "$GITHUB_WORKSPACE/kernel-work"

          repo init \
            -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b oneplus/sm8650 \
            -m oneplus_ace3_pro_b.xml

          repo sync -c -j2 --no-clone-bundle --no-tags

      - name: Inspect vendor config generation
        working-directory: kernel-work
        shell: bash
        run: |
          set -u
          LOG="$GITHUB_WORKSPACE/xpad-config-details.txt"
          exec > >(tee "$LOG") 2>&1

          echo "========== 1. Official kernel build script =========="
          sed -n '1,220p' \
            kernel_platform/oplus/build/oplus_build_kernel.sh \
            2>/dev/null || true

          echo
          echo "========== 2. prepare_vendor.sh =========="
          sed -n '1,280p' \
            kernel_platform/build/android/prepare_vendor.sh \
            2>/dev/null || true

          echo
          echo "========== 3. Build configuration scripts =========="
          find kernel_platform/build \
            -maxdepth 4 \
            -type f \
            \( -name '*bazel*.py' \
            -o -name '*config*.py' \
            -o -name '*config*.sh' \
            -o -name '*.bzl' \) \
            -not -path '*/out/*' \
            2>/dev/null | head -150 || true

          echo
          echo "========== 4. Config generation references =========="
          grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=out \
            --include='*.sh' \
            --include='*.py' \
            --include='*.bzl' \
            --include='BUILD*' \
            --include='*.config' \
            -E 'defconfig_fragments|android-recommended.config|KERNEL_CONFIG|CONFIG_JOYSTICK_XPAD_FF|pre_defconfig|post_defconfig|pineapple_GKI|merge_config|olddefconfig' \
            kernel_platform/build \
            kernel_platform/common \
            kernel_platform/msm-kernel \
            kernel_platform/oplus/build \
            2>/dev/null | head -300 || true

          echo
          echo "========== 5. XPAD Kconfig =========="
          grep -n -A30 -B5 \
            'config JOYSTICK_XPAD' \
            kernel_platform/common/drivers/input/joystick/Kconfig \
            2>/dev/null || true

          echo
          echo "========== 6. Existing ARM64 config =========="
          grep -n -E \
            'CONFIG_(JOYSTICK_XPAD|JOYSTICK_XPAD_FF|INPUT_FF_MEMLESS)=' \
            kernel_platform/common/arch/arm64/configs/gki_defconfig \
            kernel_platform/msm-kernel/arch/arm64/configs/gki_defconfig \
            kernel_platform/common/kernel/configs/android-recommended.config \
            kernel_platform/msm-kernel/kernel/configs/android-recommended.config \
            2>/dev/null || true

          echo
          echo "========== 7. Diagnosis finished =========="

      - name: Upload config details
        uses: actions/upload-artifact@v4
        with:
          name: ace3pro-xpad-config-details
          path: xpad-config-details.txt
          if-no-files-found: error
          retention-days: 7
