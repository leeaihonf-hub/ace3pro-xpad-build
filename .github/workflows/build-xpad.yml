name: Ace 3 Pro XPAD Full Source Check

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Install repo and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3
          mkdir -p "$HOME/bin"
          curl -fL https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize official manifest
        run: |
          set -eux
          mkdir kernel-work
          cd kernel-work
          repo init \
            -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b oneplus/sm8650 \
            -m oneplus_ace3_pro_b.xml \
            --depth=1

      - name: Sync official kernel sources
        working-directory: kernel-work
        run: |
          set -eux
          repo sync -c -j2 --no-clone-bundle --no-tags

      - name: Inspect build entry and XPAD settings
        working-directory: kernel-work
        run: |
          set -eu

          echo "=== Official build script ==="
          ls -l kernel_platform/oplus/build/oplus_build_kernel.sh
          sed -n '1,200p' kernel_platform/oplus/build/oplus_build_kernel.sh

          echo "=== XPAD driver options ==="
          grep -n -A35 -B5 'config JOYSTICK_XPAD' \
            kernel_platform/common/drivers/input/joystick/Kconfig

          echo "=== Existing XPAD configuration fragments ==="
          grep -R -n \
            --include='*config*' \
            --include='*.fragment' \
            'CONFIG_JOYSTICK_XPAD' \
            kernel_platform/common/arch/arm64/configs \
            kernel_platform/common/kernel/configs \
            kernel_platform/msm-kernel/arch/arm64/configs \
            2>/dev/null || true

          echo "=== Build scripts and device config references ==="
          grep -R -n \
            --include='*.sh' \
            --include='BUILD.bazel' \
            --include='*.bzl' \
            'oplus_build_kernel.sh\|pineapple.*gki' \
            kernel_platform/oplus/build \
            kernel_platform 2>/dev/null | head -100 || true

      - name: Upload source inspection results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace3pro-xpad-full-source-check
          path: |
            kernel-work/kernel_platform/oplus/build/oplus_build_kernel.sh
            kernel-work/kernel_platform/common/drivers/input/joystick/Kconfig
          if-no-files-found: warn
