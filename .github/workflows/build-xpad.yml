name: Ace 3 Pro XPAD Kernel Build

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3

      - name: Verify official source branches
        run: |
          set -eux
          git ls-remote --exit-code --heads \
            https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8650.git \
            oneplus/sm8650_b_16.0.0_ace_3_pro
          git ls-remote --exit-code --heads \
            https://github.com/OnePlusOSS/android_kernel_oneplus_sm8650.git \
            oneplus/sm8650_b_16.0.0_ace_3_pro

      - name: Download official Ace 3 Pro manifest
        run: |
          set -eux
          curl -fL \
            https://raw.githubusercontent.com/OnePlusOSS/kernel_manifest/oneplus/sm8650/oneplus_ace3_pro_b.xml \
            -o manifest.xml
          cat manifest.xml

      - name: Check XPAD force feedback configuration
        run: |
          set -eux
          git clone --depth 1 \
            --branch oneplus/sm8650_b_16.0.0_ace_3_pro \
            https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8650.git \
            kernel-common
          grep -n 'CONFIG_JOYSTICK_XPAD' \
            kernel-common/common/arch/arm64/configs/gki_defconfig || true
          grep -R -n 'CONFIG_JOYSTICK_XPAD_FF' \
            kernel-common/common/kernel/configs \
            kernel-common/common/arch/arm64/configs || true

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup repo & sync kernel source
        run: |
          set -eux
          repo init -u https://github.com/OnePlusOSS/kernel_manifest.git -b oneplus/sm8650 -m oneplus_ace3_pro_b.xml
          repo sync -j$(nproc)

      - name: Build kernel with Kleaf
        run: |
          set -eux
          cd kernel_platform
          bazel build //:ace3pro_bootimage

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-artifacts
          path: |
            bazel-bin/boot.img
            bazel-bin/vendor_boot.img
            out/.config
