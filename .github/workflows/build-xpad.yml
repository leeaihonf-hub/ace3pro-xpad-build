
name: Ace 3 Pro XPAD Kernel Build

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl python3

      - name: Verify official source branches
        run: |
          set -eux
          git ls-remote --exit-code --heads \
            https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8650.git \
            oneplus/sm8650_b_16.0.0_ace_3_pro
          git ls-remote --exit-code --heads \
            https://github.com/OnePlusOSS/android_kernel_oneplus_sm8650.git \
            oneplus/sm8650_b_16.0.0_ace_3_pro

      - name: Download official Ace 3 Pro manifest
        run: |
          set -eux
          curl -fL \
            https://raw.githubusercontent.com/OnePlusOSS/kernel_manifest/oneplus/sm8650/oneplus_ace3_pro_b.xml \
            -o manifest.xml
          cat manifest.xml

      - name: Check XPAD force feedback configuration
        run: |
          set -eux
          git clone --depth 1 \
            --branch oneplus/sm8650_b_16.0.0_ace_3_pro \
            https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8650.git \
            kernel-common
          grep -n 'CONFIG_JOYSTICK_XPAD' \
            kernel-common/common/arch/arm64/configs/gki_defconfig || true
          grep -R -n 'CONFIG_JOYSTICK_XPAD_FF' \
            kernel-common/common/kernel/configs \
            kernel-common/common/arch/arm64/configs || true
