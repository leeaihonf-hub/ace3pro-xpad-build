
name: Diagnose Ace 3 Pro Xbox Controller Rumble

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y git curl python3

      - name: Install repo tool
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o repo
          chmod +x repo
          sudo install repo /usr/local/bin/repo
          repo --version

      - name: Initialize official OnePlus source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/kernel-work"
          cd "$GITHUB_WORKSPACE/kernel-work"
          repo init \
            -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b oneplus/sm8650 \
            -m oneplus_ace3_pro_b.xml
          repo sync -c -j2 --no-clone-bundle --no-tags

      - name: Locate effective GKI config path
        working-directory: kernel-work
        shell: bash
        run: |
          set -u
          LOG="$GITHUB_WORKSPACE/xpad-config-diagnosis.txt"
          exec > >(tee "$LOG") 2>&1

          echo "========== Build entry =========="
          grep -RIn \
            --include='*.sh' \
            -E 'prepare_vendor|build_with_bazel|bazel.*(gki|config)|pineapple.*gki' \
            kernel_platform/oplus/build \
            kernel_platform/msm-kernel \
            2>/dev/null | head -150 || true

          echo "========== Bazel config definitions =========="
          grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=out \
            --include='*.bzl' \
            --include='BUILD*' \
            --include='*.bazel' \
            --include='*.config' \
            -E 'defconfig_fragments|gki_defconfig|android-recommended.config|kernel_config|pre_defconfig|post_defconfig' \
            kernel_platform/msm-kernel \
            kernel_platform/common \
            2>/dev/null | head -200 || true

          echo "========== Existing XPAD settings =========="
          grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=out \
            --include='*.config' \
            --include='*defconfig*' \
            -E 'CONFIG_JOYSTICK_XPAD_FF|CONFIG_JOYSTICK_XPAD=' \
            kernel_platform/common \
            kernel_platform/msm-kernel \
            2>/dev/null | head -100 || true

          echo "========== Diagnosis finished =========="

      - name: Upload diagnosis report
        uses: actions/upload-artifact@v4
        with:
          name: ace3pro-xpad-config-diagnosis
          path: xpad-config-diagnosis.txt
          if-no-files-found: error
          retention-days: 7
