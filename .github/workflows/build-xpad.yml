
name: Ace 3 Pro XPAD Kernel Build

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 \
            bc bison flex \
            build-essential \
            libssl-dev libelf-dev \
            zip unzip rsync \
            device-tree-compiler

      - name: Install repo tool
        run: |
          set -eux
          mkdir -p "$HOME/bin"
          curl -fL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize official OnePlus manifest
        run: |
          set -eux
          mkdir -p "$GITHUB_WORKSPACE/kernel-work"
          cd "$GITHUB_WORKSPACE/kernel-work"
          repo init \
            -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b oneplus/sm8650 \
            -m oneplus_ace3_pro_b.xml \
            --depth=1

      - name: Sync official kernel sources
        working-directory: kernel-work
        run: |
          set -eux
          repo sync -c -j2 --no-clone-bundle --no-tags

      - name: Enable XPAD rumble config
        working-directory: kernel-work
        shell: bash
        run: |
          set -eux
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path("kernel_platform/common/arch/arm64/configs/gki_defconfig"),
              Path("kernel_platform/msm-kernel/arch/arm64/configs/gki_defconfig"),
          ]

          for path in paths:
              if not path.is_file():
                  raise SystemExit(f"Missing config: {path}")

              lines = path.read_text().splitlines()
              lines = [
                  line for line in lines
                  if not line.startswith("CONFIG_JOYSTICK_XPAD_FF=")
                  and line != "# CONFIG_JOYSTICK_XPAD_FF is not set"
                  and not line.startswith("CONFIG_INPUT_FF_MEMLESS=")
                  and line != "# CONFIG_INPUT_FF_MEMLESS is not set"
              ]

              if "CONFIG_JOYSTICK_XPAD=y" not in lines:
                  lines.append("CONFIG_JOYSTICK_XPAD=y")

              lines.extend([
                  "CONFIG_JOYSTICK_XPAD_FF=y",
                  "CONFIG_INPUT_FF_MEMLESS=y",
              ])

              path.write_text("\n".join(lines) + "\n")
              print(f"Updated {path}")
          PY

      - name: Build official Ace 3 Pro GKI kernel
        id: kernel_build
        working-directory: kernel-work
        shell: bash
        run: |
          set -o pipefail
          bash kernel_platform/oplus/build/oplus_build_kernel.sh pineapple gki \
            2>&1 | tee "$GITHUB_WORKSPACE/official-build.log"

      - name: Inspect final XPAD config
        if: always()
        working-directory: kernel-work
        shell: bash
        run: |
          set +e
          : > "$GITHUB_WORKSPACE/config-files.txt"
          : > "$GITHUB_WORKSPACE/config-check.txt"

          find "$GITHUB_WORKSPACE/kernel-work/kernel_platform" \
            -type f -name .config \
            -print > "$GITHUB_WORKSPACE/config-files.txt" 2>/dev/null

          while IFS= read -r config; do
            [ -f "$config" ] || continue
            {
              echo "=== $config ==="
              grep -E \
                '^(CONFIG_JOYSTICK_XPAD=|CONFIG_JOYSTICK_XPAD_FF=|CONFIG_INPUT_FF_MEMLESS=|# CONFIG_JOYSTICK_XPAD_FF is not set|# CONFIG_INPUT_FF_MEMLESS is not set)' \
                "$config" || true
            } | tee -a "$GITHUB_WORKSPACE/config-check.txt"
          done < "$GITHUB_WORKSPACE/config-files.txt"

          if [ ! -s "$GITHUB_WORKSPACE/config-files.txt" ]; then
            echo "No .config files found." \
              | tee "$GITHUB_WORKSPACE/config-check.txt"
          fi

      - name: Search and collect kernel images
        if: always()
        shell: bash
        run: |
          set +e
          ROOT="$GITHUB_WORKSPACE"
          OUT="$ROOT/kernel-images"
          mkdir -p "$OUT"
          : > "$ROOT/found-images.txt"

          echo "=== Search image files and symlinks ==="

          find "$ROOT/kernel-work" \
            \( -type f -o -type l \) \
            \( -name boot.img -o -name vendor_boot.img \
               -o -name Image -o -name Image.gz \
               -o -name Image.lz4 \) \
            -print 2>/dev/null > "$ROOT/found-images.txt"

          cat "$ROOT/found-images.txt"

          while IFS= read -r f; do
            [ -e "$f" ] || continue
            name="$(basename "$f")"
            case "$name" in
              boot.img|vendor_boot.img|Image|Image.gz|Image.lz4)
                if [ -s "$f" ] && [ ! -e "$OUT/$name" ]; then
                  cp -L "$f" "$OUT/$name"
                  echo "Collected: $f"
                fi
                ;;
            esac
          done < "$ROOT/found-images.txt"

          echo "=== Check known dist directories ==="
          find "$ROOT/kernel-work" -type d -name dist \
            -print 2>/dev/null || true

          echo "=== Collected image files ==="
          ls -lh "$OUT"

          if ! find "$OUT" -type f -size +0c -print -quit | grep -q .; then
            echo "No images collected. See official-build.log and found-images.txt."
          fi

      - name: Upload compiled kernel images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace3pro-kernel-images
          path: kernel-images/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Upload build logs and configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace3pro-xpad-build-results
          path: |
            official-build.log
            config-files.txt
            config-check.txt
            found-images.txt
            kernel-work/kernel_platform/**/.config
          if-no-files-found: warn
          retention-days: 7
