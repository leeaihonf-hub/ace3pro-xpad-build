
name: Diagnose Ace 3 Pro Xbox Controller Rumble

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git curl python3 \
            build-essential bc bison flex \
            libssl-dev libelf-dev \
            zip unzip rsync

      - name: Install repo tool
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o repo
          chmod +x repo
          sudo install repo /usr/local/bin/repo
          repo --version

      - name: Initialize official OnePlus source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/kernel-work"
          cd "$GITHUB_WORKSPACE/kernel-work"

          repo init \
            -u https://github.com/OnePlusOSS/kernel_manifest.git \
            -b oneplus/sm8650 \
            -m oneplus_ace3_pro_b.xml

          repo sync -c -j2 --no-clone-bundle --no-tags

      - name: Diagnose kernel config entry
        working-directory: kernel-work
        shell: bash
        run: |
          set -u
          LOG="$GITHUB_WORKSPACE/xpad-config-diagnosis.txt"
          exec > >(tee "$LOG") 2>&1

          echo "========== 1. XPAD Kconfig =========="
          grep -n -A30 -B5 \
            'config JOYSTICK_XPAD' \
            kernel_platform/common/drivers/input/joystick/Kconfig \
            2>/dev/null || true

          echo
          echo "========== 2. Official build script =========="
          sed -n '1,240p' \
            kernel_platform/oplus/build/oplus_build_kernel.sh \
            2>/dev/null || true

          echo
          echo "========== 3. Config and build files =========="
          find kernel_platform \
            -type f \
            \( -name '*defconfig*' \
            -o -name '*fragment*' \
            -o -name 'build.config*' \
            -o -name 'BUILD.bazel' \
            -o -name '*.bzl' \) \
            -not -path '*/out/*' \
            -not -path '*/.git/*' \
            2>/dev/null | head -500 || true

          echo
          echo "========== 4. Pineapple GKI references =========="
          grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=out \
            --include='*.sh' \
            --include='*.bzl' \
            --include='BUILD*' \
            --include='*.config' \
            --include='*.mk' \
            -E 'pineapple_gki|gki_defconfig|KERNEL_CONFIG|DEFCONFIG|defconfig' \
            kernel_platform/msm-kernel \
            kernel_platform/oplus/build \
            kernel_platform/common \
            2>/dev/null | head -500 || true

          echo
          echo "========== 5. XPAD config settings in source =========="
          grep -RIn \
            --exclude-dir=.git \
            --exclude-dir=out \
            --include='*defconfig*' \
            --include='*.config' \
            --include='*.fragment' \
            -E 'CONFIG_JOYSTICK_XPAD(=|_FF=)|CONFIG_INPUT_FF_MEMLESS=' \
            kernel_platform \
            2>/dev/null | head -300 || true

          echo
          echo "========== Diagnosis finished =========="

      - name: Upload diagnosis report
        uses: actions/upload-artifact@v4
        with:
          name: ace3pro-xpad-config-diagnosis
          path: xpad-config-diagnosis.txt
          if-no-files-found: error
          retention-days: 7
