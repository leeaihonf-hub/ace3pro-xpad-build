
name: Ace 3 Pro XPAD Config Test

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make gcc flex bison bc \
            libssl-dev libelf-dev python3

      - name: Clone kernel source
        run: |
          set -eux
          git clone --depth 1 \
            --branch oneplus/sm8650_b_16.0.0_ace_3_pro \
            https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8650.git \
            kernel-common

      - name: Generate ARM64 GKI config
        working-directory: kernel-common
        run: |
          set -eux
          make ARCH=arm64 gki_defconfig

      - name: Check final XPAD config
        working-directory: kernel-common
        run: |
          set -eu
          echo "=== Final .config ==="
          grep -E '^CONFIG_(JOYSTICK_XPAD|JOYSTICK_XPAD_FF|JOYSTICK_XPAD_LEDS|INPUT_FF_MEMLESS)=' .config || true
          echo "=== Source Kconfig dependencies ==="
          sed -n '294,325p' drivers/input/joystick/Kconfig
          echo "=== Recommended config ==="
          grep -n 'CONFIG_JOYSTICK_XPAD' kernel/configs/android-recommended.config || true
