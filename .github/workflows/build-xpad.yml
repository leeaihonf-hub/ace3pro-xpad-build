name: Ace 3 Pro XPAD Source Check

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      - name: Clone OnePlus kernel common
        run: |
          set -eux
          git clone --depth 1 \
            --branch oneplus/sm8650_b_16.0.0_ace_3_pro \
            https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8650.git \
            kernel-common

      - name: Check missing Kconfig and related source
        run: |
          set -eu
          cd kernel-common

          echo "=== Expected Kconfig path ==="
          if [ -f kernel/oplus_cpu/sched/Kconfig ]; then
            echo "FOUND in common repository"
          else
            echo "NOT FOUND in common repository"
          fi

          echo "=== Search tracked source for scheduler Kconfig ==="
          git ls-files '*oplus_cpu*' '*sched/Kconfig*' | head -200 || true

          echo "=== Check kernel manifest ==="
          cd ..
          curl -fL \
            https://raw.githubusercontent.com/OnePlusOSS/kernel_manifest/oneplus/sm8650/oneplus_ace3_pro_b.xml \
            -o oneplus_ace3_pro_b.xml
          cat oneplus_ace3_pro_b.xml

      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xpad-source-diagnostics
          path: |
            oneplus_ace3_pro_b.xml
            kernel-common/drivers/input/joystick/Kconfig
            kernel-common/kernel/configs/android-recommended.config
          if-no-files-found: warn
