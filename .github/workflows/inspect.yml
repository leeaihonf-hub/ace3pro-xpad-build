
name: Inspect Ace 3 Pro Xpad Vibration Support

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout common kernel source
        run: |
          git clone --depth 1 \
            --branch oneplus/sm8650_b_16.0.0_ace_3_pro \
            https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8650.git \
            common

      - name: Inspect xpad force feedback support
        working-directory: common
        run: |
          echo "=== Xpad Kconfig ==="
          grep -n -A 18 -B 5 'config JOYSTICK_XPAD' \
            drivers/input/joystick/Kconfig || true

          echo "=== Force feedback references ==="
          grep -n -E 'CONFIG_JOYSTICK_XPAD_FF|JOYSTICK_XPAD_FF' \
            drivers/input/joystick/Kconfig \
            drivers/input/joystick/Makefile || true

          echo "=== Xpad source references ==="
          grep -n -E 'FF_RUMBLE|FF_PERIODIC|input_ff|force.?feedback|rumble|XINPUT' \
            drivers/input/joystick/xpad.c | head -n 100 || true

          echo "=== Relevant source files ==="
          find drivers/input/joystick -maxdepth 1 \
            -iname '*xpad*' -type f

      - name: Check modules repository configuration
        run: |
          git clone --depth 1 \
            --branch oneplus/sm8650_b_16.0.0_ace_3_pro \
            https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8650.git \
            modules

          echo "=== Relevant kernel configs ==="
          find common modules \
            -path '*/.git' -prune -o \
            -type f \( -name '*defconfig' -o -name '*defconfig.fragment' \) \
            -print \
            | grep -v '/wlan/' \
            | grep -Ei 'pineapple|sm8650|gki|vendor|kona' \
            | head -n 100 || true

          echo "=== Existing xpad FF settings ==="
          grep -R -n -E 'CONFIG_JOYSTICK_XPAD(_FF)?=' \
            common modules \
            --include='*defconfig*' \
            --include='*.fragment' \
            2>/dev/null | head -n 100 || true
