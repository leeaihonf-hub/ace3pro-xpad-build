
name: Inspect Ace 3 Pro Xpad Vibration Support

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout kernel source
        run: |
          git clone --depth 1 \
            --branch oneplus/sm8650_b_16.0.0_ace_3_pro \
            https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8650.git \
            common

      - name: Check configuration merge flow
        working-directory: common
        run: |
          echo "=== Recommended config ==="
          sed -n '75,95p' kernel/configs/android-recommended.config

          echo "=== GKI build config ==="
          sed -n '1,220p' build.config.gki.aarch64

          echo "=== References to recommended config ==="
          grep -R -n -E 'android-recommended\.config|merge_config\.sh|KCONFIG_CONFIG|POST_DEFCONFIG_CMDS|DEFCONFIG' \
            build.config* build scripts 2>/dev/null \
            | head -n 160 || true

          echo "=== xpad FF config declarations ==="
          grep -R -n 'JOYSTICK_XPAD_FF' \
            kernel/configs arch/arm64/configs drivers/input/joystick/Kconfig \
            2>/dev/null | head -n 80 || true
