
name: Inspect Ace 3 Pro Xpad Vibration Support

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout common kernel source
        run: |
          git clone --depth 1 \
            --branch oneplus/sm8650_b_16.0.0_ace_3_pro \
            https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8650.git \
            common

      - name: Checkout kernel modules source
        run: |
          git clone --depth 1 \
            --branch oneplus/sm8650_b_16.0.0_ace_3_pro \
            https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8650.git \
            modules

      - name: Inspect ARM64 kernel configuration
        run: |
          echo "=== ARM64 GKI xpad settings ==="
          grep -n -E 'CONFIG_JOYSTICK_XPAD|CONFIG_INPUT_FF_MEMLESS' \
            common/arch/arm64/configs/gki_defconfig || true

          echo "=== All xpad FF config references ==="
          grep -R -n -E 'CONFIG_JOYSTICK_XPAD_FF|JOYSTICK_XPAD_FF' \
            common modules \
            --exclude-dir=.git \
            --exclude='*.c' \
            --exclude='*.h' \
            --exclude='*.o' \
            --exclude='*.a' \
            --exclude='*.so' \
            2>/dev/null | head -n 150 || true

          echo "=== ARM64 config files ==="
          find common/arch/arm64/configs -maxdepth 2 -type f \
            | head -n 100

          echo "=== Kernel build entry points ==="
          find common -maxdepth 3 -type f \
            \( -name 'build.config*' -o -name 'BUILD.bazel' \
            -o -name 'build.sh' -o -name 'Makefile' \) \
            -print | head -n 100
