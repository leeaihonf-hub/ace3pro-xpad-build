
name: Inspect Ace 3 Pro Kernel Build Flow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout official kernel source
        run: |
          git clone --depth 1 \
            --branch oneplus/sm8650_b_16.0.0_ace_3_pro \
            https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8650.git \
            common

      - name: Checkout official modules source
        run: |
          git clone --depth 1 \
            --branch oneplus/sm8650_b_16.0.0_ace_3_pro \
            https://github.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8650.git \
            modules

      - name: Inspect official build flow
        run: |
          echo "=== Build scripts in common ==="
          find common -maxdepth 3 -type f \
            \( -iname '*build*.sh' -o -name 'build.config*' \
            -o -name 'Makefile' \) \
            | head -n 100

          echo "=== Build scripts in modules ==="
          find modules -maxdepth 5 -type f \
            \( -iname '*build*.sh' -o -name 'build.config*' \
            -o -iname '*kernel*.sh' \) \
            | head -n 120

          echo "=== Config merge references ==="
          grep -R -n -E \
            'android-recommended\.config|GKI_BUILD_CONFIG_FRAGMENT|FRAGMENT_CONFIG|merge_config\.sh|gki_defconfig' \
            common/build.config* common/build.sh common/build \
            modules \
            --exclude-dir=.git \
            --exclude='*.c' --exclude='*.h' \
            --exclude='*.o' --exclude='*.a' \
            2>/dev/null | head -n 160 || true

          echo "=== Kernel config and boot artifact references ==="
          grep -R -n -E \
            'Image\.lz4|Image\.gz|vendor_boot\.img|boot\.img|KERNEL_DIR|OUT_DIR' \
            common/build.config* modules \
            --exclude-dir=.git \
            --exclude='*.c' --exclude='*.h' \
            --exclude='*.o' --exclude='*.a' \
            2>/dev/null | head -n 120 || true
